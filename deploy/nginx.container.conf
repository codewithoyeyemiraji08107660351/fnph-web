# FNPH web app inside its container, behind Dokploy's Traefik proxy.
# Traefik terminates HTTPS and sends /api/* straight to the backend, so this
# server only serves the built app.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The video consultation runs in a Daily iframe. Camera, microphone and
    # screen sharing must be delegated to it; "(self)" alone blocked them, so
    # every consultation opened with no camera and no sound.
    add_header Permissions-Policy "camera=(self \"https://*.daily.co\"), microphone=(self \"https://*.daily.co\"), display-capture=(self \"https://*.daily.co\"), fullscreen=(self \"https://*.daily.co\"), autoplay=(self \"https://*.daily.co\"), speaker-selection=(self \"https://*.daily.co\"), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.fnphkad.cloud; frame-src 'self' https://*.daily.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.remita.net" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The shell must always be revalidated so a release is picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self \"https://*.daily.co\"), microphone=(self \"https://*.daily.co\"), display-capture=(self \"https://*.daily.co\"), fullscreen=(self \"https://*.daily.co\"), autoplay=(self \"https://*.daily.co\"), speaker-selection=(self \"https://*.daily.co\"), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.fnphkad.cloud; frame-src 'self' https://*.daily.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.remita.net" always;
        try_files $uri /index.html;
    }
}
