# FNPH Kaduna Telepsychiatry web front end.
# Serves the built app and proxies /api to Spring Boot on the same origin,
# so no CORS is involved in production and tokens never cross origins.
# Replace the server_name and certificate paths before use.

server {
    listen 80;
    server_name telepsychiatry.example.gov.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name telepsychiatry.example.gov.ng;

    ssl_certificate     /etc/letsencrypt/live/telepsychiatry.example.gov.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telepsychiatry.example.gov.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/fnph-web/dist;
    index index.html;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The video consultation runs in a Daily iframe. Camera and microphone must
    # be delegated to it; "(self)" alone blocked them.
    add_header Permissions-Policy "camera=(self \"https://*.daily.co\"), microphone=(self \"https://*.daily.co\"), display-capture=(self \"https://*.daily.co\"), fullscreen=(self \"https://*.daily.co\"), autoplay=(self \"https://*.daily.co\"), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.fnphkad.cloud; frame-src 'self' https://*.daily.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.remita.net" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The shell must always be revalidated so a release is picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
